name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "arm64"
      - name: Run Codex protocol fixture tests
        # WidgetWebViewTests already exercise source assets when
        # WHALE_WIDGET_RESOURCE_ROOT is unset. Skip that pass here and keep
        # packaged-app coverage after the ad-hoc bundle is built.
        run: swift test --package-path MacOSApp --skip WidgetWebViewTests
      - name: Regression source checks
        run: bash MacOSApp/scripts/verify-source.sh
      - name: Build ad-hoc arm64 App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_MODE: ad-hoc
        run: MacOSApp/scripts/build.sh
      - name: Run packaged WKWebView geometry tests
        env:
          WHALE_WIDGET_RESOURCE_ROOT: ${{ github.workspace }}/MacOSApp/dist/AI Balance Whale.app/Contents/Resources
        run: swift test --package-path MacOSApp --filter WidgetWebViewTests
      - name: Verify App bundle
        run: |
          set -euo pipefail
          APP="MacOSApp/dist/AI Balance Whale.app"
          SOURCE="MacOSApp/Resources/Info.plist"
          bash MacOSApp/scripts/verify-app.sh "$APP"
          SOURCE_SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SOURCE")"
          SOURCE_TAG="$(/usr/libexec/PlistBuddy -c 'Print :AIAppReleaseTag' "$SOURCE")"
          BUILT_SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          BUILT_TAG="$(/usr/libexec/PlistBuddy -c 'Print :AIAppReleaseTag' "$APP/Contents/Info.plist")"
          test "$SOURCE_SHORT" = "${SOURCE_TAG%%-*}"
          test "$BUILT_SHORT" = "$SOURCE_SHORT"
          test "$BUILT_TAG" = "$SOURCE_TAG"
