name: macOS CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "arm64"
      - name: Run Codex protocol fixture tests
        run: swift test --package-path MacOSApp
      - name: Regression source checks
        run: bash MacOSApp/scripts/verify-source.sh
      - name: Build ad-hoc arm64 App
        env:
          APP_VERSION: 0.1.0-beta.4
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_MODE: ad-hoc
        run: MacOSApp/scripts/build.sh
      - name: Verify App bundle
        run: |
          APP="MacOSApp/dist/AI Balance Whale.app"
          test -d "$APP"
          test -f "$APP/Contents/Resources/WhaleWidget.html"
          test -f "$APP/Contents/Resources/Settings.html"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/DSniang1.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "0.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = "AppIcon"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/AIBalanceWhale" | grep -Eq '(^| )arm64( |$)'
