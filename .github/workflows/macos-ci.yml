name: macOS CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-gate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify runner toolchain
        run: |
          if [[ -d /Applications/Xcode_16.4.app ]]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "arm64"
      - name: Acceptance gate (source)
        uses: ./.github/actions/macos-acceptance
        with:
          mode: source
      - name: Build ad-hoc arm64 App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_MODE: ad-hoc
        run: MacOSApp/scripts/build.sh
      - name: Acceptance gate (packaged app)
        uses: ./.github/actions/macos-acceptance
        env:
          WHALE_WIDGET_RESOURCE_ROOT: ${{ github.workspace }}/MacOSApp/dist/AI Balance Whale.app/Contents/Resources
        with:
          mode: packaged
      - name: Verify App bundle
        run: |
          set -euo pipefail
          APP="MacOSApp/dist/AI Balance Whale.app"
          SOURCE="MacOSApp/Resources/Info.plist"
          bash MacOSApp/scripts/verify-app.sh "$APP"
          SOURCE_SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SOURCE")"
          SOURCE_TAG="$(/usr/libexec/PlistBuddy -c 'Print :AIAppReleaseTag' "$SOURCE")"
          BUILT_SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          BUILT_TAG="$(/usr/libexec/PlistBuddy -c 'Print :AIAppReleaseTag' "$APP/Contents/Info.plist")"
          test "$SOURCE_SHORT" = "${SOURCE_TAG%%-*}"
          test "$BUILT_SHORT" = "$SOURCE_SHORT"
          test "$BUILT_TAG" = "$SOURCE_TAG"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-balance-whale-acceptance
          if-no-files-found: error
