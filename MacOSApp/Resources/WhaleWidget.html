<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Balance Whale</title>
<style>
:root { color-scheme: light; --ai-scale: 1; --ai-content-height: 184; background: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
html .dshwv-root { position: absolute !important; left: 0 !important; top: 0 !important; right: auto !important; bottom: auto !important; width: calc(248px * var(--ai-scale)) !important; height: calc(var(--ai-content-height) * 1px * var(--ai-scale)) !important; --dshw-base: calc(248px * var(--ai-scale)) !important; transform: none !important; transition: none !important; overflow: visible !important; }
html .dshwv-body { width: 100% !important; height: 100% !important; position: relative !important; }
/* The character belongs to its own fixed bottom region.  Never derive its
   height from the expanded bubble viewport, otherwise opening a bubble grows
   the image into the speech content. */
html .dshwv-img { right: auto !important; left: calc(32px * var(--ai-scale)) !important; bottom: 0 !important; width: calc(184px * var(--ai-scale)) !important; height: calc(174px * var(--ai-scale)) !important; object-fit: contain !important; object-position: center bottom !important; }
html .dshwv-pop { left: .8% !important; top: 0 !important; width: 98.4% !important; height: auto !important; }
html .dshwv-menu { max-height: 86vh; overflow-y: auto; }
html .dshwv-menu-btn.dshwv-menu-btn-pinned { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
html.aiwhale-editor, html.aiwhale-editor body { overflow: auto !important; }
</style>
</head>
<body>
<script>
(function () {
  "use strict";
  window.__AIWhaleStandalone = true;
  var token = (location.hash || "").replace(/^#/, "");
  if (token === "upstream-settings") document.documentElement.classList.add("aiwhale-editor")
  var pending = Object.create(null);
  var requestSerial = 0;
  var resourceURLs = { roles: {}, bubbles: {}, audio: {} };
  window.__AIWhaleResourceURLs = resourceURLs;
  function post(type, payload) {
    var message = Object.assign({ type: type, navigationToken: token }, payload || {});
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(message);
      }
    } catch (error) { console.error("native bridge post failed", error); }
  }
  window.__AIWhaleNativePost = post;
  function mergeResources(path, body) {
    if (!body || typeof body !== "object") return;
    if (path.indexOf("/roles.json") >= 0 && Array.isArray(body.roles)) body.roles.forEach(function (item) {
      if (item && item.id && item.url) resourceURLs.roles[item.id] = item.url;
    });
    if (path.indexOf("/bubble-imgs.json") >= 0 && Array.isArray(body.images)) body.images.forEach(function (item) {
      if (item && item.id && item.url) resourceURLs.bubbles[item.id] = item.url;
    });
    if (path.indexOf("/audio.json") >= 0) {
      (body.fragments || []).forEach(function (item) {
        if (item && item.id && item.url) resourceURLs.audio[item.id] = item.url;
      });
      (body.groups || []).forEach(function (item) {
        if (!item || !item.id) return;
        if (item.pressURL) resourceURLs.audio["press:" + item.id] = item.pressURL;
        if (item.releaseURL) resourceURLs.audio["release:" + item.id] = item.releaseURL;
      });
    }
  }
  window.__AIWhaleHostResponse = function (id, status, body) {
    var item = pending[String(id)];
    if (!item) return;
    delete pending[String(id)];
    mergeResources(item.path, body);
    item.resolve(new Response(JSON.stringify(body == null ? {} : body), { status: Number(status) || 500, headers: { "Content-Type": "application/json" } }));
  };
  function hostFetch(input, options) {
    options = options || {};
    var raw = typeof input === "string" ? input : (input && input.url) || "";
    var url;
    try { url = new URL(raw, location.href); } catch (error) { return Promise.reject(error); }
    if (url.pathname.indexOf("/dsh-whale/") !== 0) return window.__AIWhaleNativeFetch(input, options);
    var id = "host-" + (++requestSerial);
    var method = String(options.method || "GET").toUpperCase();
    var body = options.body || null;
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { delete pending[id]; reject(new Error("本地数据请求超时")); }, 30000);
      pending[id] = { path: url.pathname + url.search, resolve: function (response) { clearTimeout(timer); resolve(response); }, reject: function (error) { clearTimeout(timer); reject(error); } };
      post("hostRequest", { requestId: id, method: method, path: url.pathname + url.search, body: body });
    });
  }
  window.__AIWhaleNativeFetch = window.fetch.bind(window);
  window.fetch = hostFetch;
  window.__AIWhale = {
    update: function (next) {
      window.__AIWhaleState = Object.assign({}, window.__AIWhaleState || {}, next || {});
      if (next && next.roleImage) resourceURLs.roles.default = next.roleImage;
      if (window.__AIWhaleHostDataUpdated) window.__AIWhaleHostDataUpdated();
    },
    setLayout: function (layout) {
      layout = layout || {};
      var scale = Number(layout.scale); if (!isFinite(scale) || scale <= 0) scale = 1;
      var height = Number(layout.height); if (!isFinite(height) || height <= 0) height = 184;
      document.documentElement.style.setProperty("--ai-scale", String(scale));
      document.documentElement.style.setProperty("--ai-content-height", String(height / scale));
      var root = document.querySelector(".dshwv-root");
      if (root) { root.style.setProperty("--dshw-base", (248 * scale) + "px", "important"); root.style.setProperty("--dshw-scale", String(scale)); }
      if (window.__AIWhaleLayoutUpdated) window.__AIWhaleLayoutUpdated(layout);
    },
    toggleBubble: function () {
      var root = document.querySelector(".dshwv-root");
      if (root && root.__dshwHideBubble && root.querySelector(".dshwv-pop-open")) root.__dshwHideBubble();
      else if (root && root.__dshwToggleBubble) root.__dshwToggleBubble();
    },
    nativePointerDown: function () {
      var root = document.querySelector(".dshwv-root")
      if (root && root.__dshwNativePointerDown) root.__dshwNativePointerDown()
    },
    nativePointerUp: function (moved) {
      var root = document.querySelector(".dshwv-root")
      if (root && root.__dshwNativePointerUp) root.__dshwNativePointerUp(!!moved)
    },
    nativeContextMenu: function () {
      var root = document.querySelector(".dshwv-root")
      if (root && root.__dshwNativeContextMenu) root.__dshwNativeContextMenu()
    }
  };
  var lastLayoutSignature = "";
  function reportLayout() {
    requestAnimationFrame(function () {
      var root = document.querySelector(".dshwv-root"), whale = document.querySelector(".dshwv-img"), bubble = document.querySelector(".dshwv-pop"), menu = document.querySelector(".dshwv-menu-btn");
      if (!root || !whale || !bubble) return;
      var rr = root.getBoundingClientRect(), wr = whale.getBoundingClientRect(), br = bubble.getBoundingClientRect(), mr = menu ? menu.getBoundingClientRect() : { x: 0, y: 0, width: 0, height: 0 };
      var visible = bubble.classList.contains("dshwv-pop-open");
      var signature = [visible, rr.width, rr.height, wr.x, wr.y, wr.width, wr.height, br.x, br.y, br.width, br.height].map(function (x) { return Number(x).toFixed(2) }).join("/");
      if (signature === lastLayoutSignature) return;
      lastLayoutSignature = signature;
      var scale = Number(getComputedStyle(document.documentElement).getPropertyValue("--ai-scale"));
      if (!isFinite(scale) || scale <= 0) scale = 1;
      // Native layout works in unscaled CSS points; report the actual SVG
      // bubble height rather than the old compact sentinel height.
      post("bubbleLayout", { embedded: false, visible: visible, scale: scale, height: Math.ceil(br.height / scale), innerWidth: window.innerWidth, innerHeight: window.innerHeight, rootX: rr.x, rootY: rr.y, rootW: rr.width, rootH: rr.height, whaleX: wr.x, whaleY: wr.y, whaleW: wr.width, whaleH: wr.height, bubbleX: br.x, bubbleY: br.y, bubbleW: br.width, bubbleH: br.height, menuX: mr.x, menuY: mr.y, menuW: mr.width, menuH: mr.height });
    });
  }
  window.__AIWhaleHostDataUpdated = function () { var s = window.__AIWhaleState || {}; var image = document.querySelector(".dshwv-img"); if (image && s.roleImage && image.getAttribute("src") !== s.roleImage) image.src = s.roleImage; var root = document.querySelector(".dshwv-root"); if (root) root.classList.toggle("dshwv-left", !!s.flip); window.dispatchEvent(new Event("aiwhale-data")); reportLayout(); }
  window.__AIWhaleLayoutUpdated = reportLayout;
  window.addEventListener("load", function () { post("ready"); reportLayout(); });
  window.addEventListener("resize", reportLayout);
}());
</script>
<script src="whale-widget.js"></script>
</body>
</html>
