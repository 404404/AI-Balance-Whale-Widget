<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸鱼额度 设置</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#203170;background:#f4f6fb}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex}
aside{width:188px;background:#203170;color:white;padding:22px 12px;display:flex;flex-direction:column}
aside h1{font-size:18px;margin:0 7px 5px}aside p{font-size:11px;opacity:.7;margin:0 7px 18px}
nav{flex:1}nav button{display:block;width:100%;border:0;border-radius:10px;background:none;color:#dce5ff;padding:10px;text-align:left;font:inherit;font-size:13px;cursor:pointer}
nav button.active,nav button:hover{background:white;color:#203170}
main{flex:1;overflow:auto;padding:25px 30px}.page{display:none;max-width:820px}.page.active{display:block}
h2{margin:0 0 6px;font-size:23px}.lead,.note,small{font-size:12px;color:#7482a3;line-height:1.5}
.card{background:white;border:1px solid #dfe5f2;border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}
input,select,textarea{width:100%;padding:8px;border:1px solid #cbd4e7;border-radius:8px;font:inherit;font-size:12px;color:#203170;background:white}
textarea{min-height:64px}.check{display:flex;align-items:center;gap:7px;font-size:12px;margin:9px 0;min-height:36px}.check input{width:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.primary,button.secondary,button.danger{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
button.primary{background:#203170;color:white}button.secondary{background:#edf1fc;color:#294589}button.danger{background:#fff0f0;color:#a9434b}
.status{padding:9px;border-radius:8px;background:#f0f4ff;color:#506296;font-size:12px;line-height:1.45}
.mono{font:11px ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;color:#66749b}
.meter{height:7px;background:#e7ecf6;border-radius:99px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:#203170;border-radius:99px}
.preview{border:1px solid #dfe5f2;border-radius:28px;background:#fff;padding:14px;min-height:88px}
.step-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:700px){aside{width:148px}main{padding:20px 15px}.grid{grid-template-columns:1fr}}
</style></head><body>
<aside>
  <h1>小鲸鱼额度</h1>
  <p>订阅与余额同一套设置</p>
  <nav id="nav"></nav>
  <button class="secondary" id="done" style="margin-top:12px">完成</button>
</aside>
<main>
  <section class="page" data-page="general"><h2>通用</h2><p class="lead">缩放、吸附、侧边按钮和右键菜单都在这里。</p><div id="general"></div></section>
  <section class="page" data-page="accounts"><h2>账户与额度</h2><p class="lead">订阅（Codex / Grok / Cursor）和余额（DeepSeek）是并列账户，不再互相覆盖。未连接账户不会显示伪造额度；密钥只进本机 Keychain。</p><div id="accounts"></div></section>
  <section class="page" data-page="bubbles"><h2>气泡内容</h2><p class="lead">这里直接使用上游气泡编辑器：点击队列、并列权重、模块排版、样式、随机语句和预览共用桌面渲染器。</p><div id="bubbles"><div class="card"><p class="note">编辑器加载本地资源中；修改后使用编辑器的保存按钮写入同一份气泡配置。</p><div id="upstreamEditorMount"></div></div></div></section>
  <section class="page" data-page="appearance"><h2>外观</h2><p class="lead">人偶使用内置鲸鱼形象。左吸附会水平翻转。</p><div id="appearance"></div></section>
  <section class="page" data-page="sounds"><h2>音效</h2><div id="sounds"></div></section>
  <section class="page" data-page="alerts"><h2>提醒</h2><div id="alerts"></div></section>
  <section class="page" data-page="about"><h2>关于</h2><div id="about"></div></section>
</main>
<script>
// The mature upstream editor is mounted directly into this page. It is not an
// iframe and never receives credentials; its local routes are handled by the
// native SettingsWindowController bridge below.
window.__AIWhaleStandalone = true;
window.__AIWhaleEditorMode = true;
window.__AIWhaleEditorMount = document.getElementById("upstreamEditorMount");
window.__AIWhaleResourceURLs = { roles: {}, bubbles: {}, audio: {} };
(function () {
  var pending = Object.create(null), serial = 0;
  function post(type, payload) {
    var body = Object.assign({ type: type, navigationToken: "settings-editor" }, payload || {});
    try { window.webkit.messageHandlers.bridge.postMessage(body); } catch (e) { console.error(e); }
  }
  window.__AIWhaleNativePost = post;
  window.__AIWhaleNativeFetch = window.fetch.bind(window);
  window.__AIWhaleHostResponse = function (id, status, body) {
    var item = pending[String(id)]; if (!item) return; delete pending[String(id)];
    item.resolve(new Response(JSON.stringify(body || {}), { status: Number(status) || 500, headers: { "Content-Type": "application/json" } }));
  };
  window.fetch = function (input, options) {
    options = options || {};
    var raw = typeof input === "string" ? input : (input && input.url) || "";
    var url; try { url = new URL(raw, location.href); } catch (e) { return Promise.reject(e); }
    if (url.pathname.indexOf("/dsh-whale/") !== 0) return window.__AIWhaleNativeFetch(input, options);
    var id = "settings-host-" + (++serial);
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { delete pending[id]; reject(new Error("本地设置请求超时")); }, 30000);
      pending[id] = { resolve: function (response) { clearTimeout(timer); resolve(response); }, reject: reject };
      post("hostRequest", { requestId: id, method: String(options.method || "GET").toUpperCase(), path: url.pathname + url.search, body: options.body || null });
    });
  };
}());
</script>
<script src="whale-widget.js"></script>
<script>
(function () {
  "use strict";
  var m = { config: { layout: {}, appearance: { showMenuButton: true }, sound: {}, bubble: { steps: [] }, accounts: [], reminders: {} }, providerMeta: {}, app: {} };
  var page = "general";
  var names = { general: "通用", accounts: "账户与额度", bubbles: "气泡内容", appearance: "外观", sounds: "音效", alerts: "提醒", about: "关于" };
  function post(type, x) {
    var o = Object.assign({ type: type }, x || {});
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.settings) window.webkit.messageHandlers.settings.postMessage(o); } catch (e) {}
  }
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]); }); }
  function get(a, d) { var x = m.config; for (var i = 0; i < a.length; i++) { if (!x || typeof x !== "object" || !(a[i] in x)) return d; x = x[a[i]]; } return x == null ? d : x; }
  function set(a, v) { var x = m.config; for (var i = 0; i < a.length - 1; i++) { if (!x[a[i]] || typeof x[a[i]] !== "object") x[a[i]] = {}; x = x[a[i]]; } x[a[a.length - 1]] = v; if (a[0] === "bubble") m.config.bubbleCustomized = true; }
  function val(id) { var x = document.getElementById(id); return x ? x.value : ""; }
  function yes(id) { var x = document.getElementById(id); return !!(x && x.checked); }
  var saveSerial = 0;
  function save() { var requestId = "settings-save-" + (++saveSerial); post("saveConfig", { config: m.config, requestId: requestId }); }
  function say(s) {
    var x = document.getElementById("toast");
    if (!x) { x = document.createElement("div"); x.id = "toast"; x.style = "position:fixed;right:20px;bottom:18px;padding:9px 13px;background:#203170;color:#fff;border-radius:8px;font-size:12px"; document.body.appendChild(x); }
    x.textContent = s; clearTimeout(say.t); say.t = setTimeout(function () { x.remove(); }, 2000);
  }
  function accounts() { return Array.isArray(m.config.accounts) ? m.config.accounts : []; }
  function steps() { var b = get(["bubble"], {}); return Array.isArray(b.steps) ? b.steps : []; }
  function meta(p) { return (m.providerMeta && m.providerMeta[p]) || { label: p, help: "", tokenHint: "密钥", kind: "subscription", currency: "USD" }; }
  function remainLabel(pct) { return Math.max(0, Math.min(100, Math.round(Number(pct) || 0))) + "%"; }
  function formatReset(ms) {
    if (!ms) return "—";
    var delta = ms - Date.now();
    if (delta <= 0) return "即将重置";
    var minutes = Math.round(delta / 60000);
    if (minutes < 60) return minutes + " 分钟后";
    var h = Math.floor(minutes / 60), r = minutes % 60;
    if (h < 48) return r ? h + " 小时 " + r + " 分后" : h + " 小时后";
    return Math.floor(h / 24) + " 天后";
  }
  function money(a) { return ((a.currency === "CNY") ? "¥" : "$") + Number(a.remaining || 0).toFixed(2); }
  function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10); }

  function moduleView(mod, accs) {
    if (mod.type === "text") return '<p style="margin:0;font-size:' + (mod.size || 14) + 'px;font-weight:' + (mod.bold ? 650 : 500) + '">' + esc(mod.text || "") + "</p>";
    if (mod.type === "random") return '<p style="margin:0;font-weight:650">' + esc((mod.lines && mod.lines[0]) || "……") + "</p>";
    if (mod.type === "image") return '<p class="note">图片模块</p>';
    if (mod.type === "dashboard") {
      var rows = (accs || []).filter(function (a) { return a.enabled !== false; });
      if (!rows.length) return '<p class="note">没有启用的账户</p>';
      return '<div style="width:200px;text-align:left"><p style="margin:0 0 6px;font-weight:650">额度总览</p>' + rows.map(function (a) {
        var w = (a.windows || [])[0] || {};
        var label = a.kind === "balance" ? money(a) : remainLabel(w.remainPct);
        var pct = a.kind === "balance" ? Math.min(100, (Number(a.remaining || 0) / Math.max(1, Number(a.total || 50))) * 100) : Number(w.remainPct || 0);
        return '<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + esc(a.name) + '</span><span class="mono">' + esc(label) + "</span></div><div class=\"meter\"><i style=\"width:" + pct + '%"></i></div></div>';
      }).join("") + "</div>";
    }
    if (mod.type === "quota") {
      var acc = (accs || []).filter(function (a) { return a.id === mod.accountId; })[0];
      var w = acc && ((acc.windows || []).filter(function (x) { return x.id === mod.windowId; })[0] || acc.windows[0]);
      if (!acc || !w) return '<p class="note">未配置该订阅</p>';
      if (mod.field === "remain") return '<p class="mono" style="margin:0;font-size:20px">' + remainLabel(w.remainPct) + "</p>";
      if (mod.field === "reset") return '<p class="note" style="margin:0">' + formatReset(w.resetAt) + "</p>";
      return '<div style="width:180px;text-align:left"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + esc(w.label) + '</span><span class="mono">' + remainLabel(w.remainPct) + '</span></div><div class="meter"><i style="width:' + Number(w.remainPct || 0) + '%"></i></div><p class="note" style="margin:4px 0 0">' + formatReset(w.resetAt) + "</p></div>";
    }
    var bal = (accs || []).filter(function (a) { return a.id === mod.accountId; })[0];
    if (!bal) return '<p class="note">未配置该余额账户</p>';
    return '<div><p class="mono" style="margin:0;font-size:22px">' + money(bal) + '</p><p class="note" style="margin:4px 0 0">' + esc(bal.message || "") + "</p></div>";
  }
  function stepView(step, accs) {
    return '<div class="preview">' + (step.modules || []).map(function (mod) { return moduleView(mod, accs); }).join("") + "</div>";
  }

  function navigation() {
    document.getElementById("nav").innerHTML = Object.keys(names).map(function (k) { return '<button data-page="' + k + '">' + names[k] + "</button>"; }).join("");
    document.querySelectorAll("#nav button").forEach(function (x) { x.onclick = function () { go(x.dataset.page); }; });
  }
  function go(p) { page = names[p] ? p : "general"; document.querySelectorAll(".page").forEach(function (x) { x.classList.toggle("active", x.dataset.page === page); }); document.querySelectorAll("#nav button").forEach(function (x) { x.classList.toggle("active", x.dataset.page === page); }); render(); }
  function render() {
    if (page === "general") general();
    else if (page === "accounts") accountsPage();
    else if (page === "bubbles") bubblesPage();
    else if (page === "appearance") appearancePage();
    else if (page === "sounds") soundsPage();
    else if (page === "alerts") alertsPage();
    else aboutPage();
  }

  function general() {
    var a = get(["appearance"], {}), l = get(["layout"], {});
    document.getElementById("general").innerHTML = '<div class="card"><div class="field"><label>缩放 <span id="sl">' + esc(l.scale == null ? 1 : l.scale) + '</span></label><input id="scale" type="range" min=".65" max="1.6" step=".05" value="' + esc(l.scale == null ? 1 : l.scale) + '"></div><div class="grid"><label class="check"><input id="snap" type="checkbox" ' + (a.snapEnabled !== false ? "checked" : "") + '>边缘吸附</label><label class="check"><input id="menuButton" type="checkbox" ' + (a.showMenuButton !== false ? "checked" : "") + '>显示人偶侧边设置按钮</label><label class="check"><input id="top" type="checkbox" ' + (l.alwaysOnTop ? "checked" : "") + '>置顶</label><label class="check"><input id="spaces" type="checkbox" ' + (l.allSpaces ? "checked" : "") + '>跨桌面 / 全屏辅助</label><label class="check"><input id="pass" type="checkbox" ' + (l.mousePassthrough ? "checked" : "") + '>鼠标穿透</label><label class="check"><input id="login" type="checkbox" ' + (l.launchAtLogin ? "checked" : "") + '>登录时启动</label></div><p class="note">右键人偶始终可以打开同一份菜单。关掉侧边按钮也不会丢掉设置入口。</p><div class="actions"><button class="primary" id="saveGeneral">保存并预览</button><button class="secondary" id="reset">恢复人偶位置</button></div></div>';
    document.getElementById("scale").oninput = function () { document.getElementById("sl").textContent = this.value; set(["layout", "scale"], Number(this.value)); post("previewAppearance", { config: m.config }); };
    document.getElementById("saveGeneral").onclick = function () {
      set(["layout", "scale"], Number(val("scale"))); set(["layout", "alwaysOnTop"], yes("top")); set(["layout", "allSpaces"], yes("spaces")); set(["layout", "mousePassthrough"], yes("pass")); set(["layout", "launchAtLogin"], yes("login")); set(["appearance", "snapEnabled"], yes("snap")); set(["appearance", "showMenuButton"], yes("menuButton")); save();
    };
    document.getElementById("reset").onclick = function () { post("resetLayout"); say("已恢复默认位置"); };
  }

  function accountsPage() {
    var list = accounts();
    var options = Object.keys(m.providerMeta || { openrouter: 1, glm: 1, kimi: 1, minimax: 1 }).map(function (id) { return '<option value="' + esc(id) + '">' + esc(meta(id).label) + "</option>"; }).join("");
    document.getElementById("accounts").innerHTML = '<div class="card"><div class="actions"><select id="pick">' + options + '</select><button class="secondary" id="add">添加账户</button></div></div><div id="accountCards"></div>';
    document.getElementById("add").onclick = function () { post("addAccount", { provider: val("pick") || "openrouter" }); };
    document.getElementById("accountCards").innerHTML = list.map(accountCard).join("");
    list.forEach(bindAccountCard);
  }
  function accountCard(a) {
    var info = meta(a.provider);
    var windows = (a.windows || []).map(function (w) {
      return '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + esc(w.label) + '</span><span class="mono">剩余 ' + remainLabel(w.remainPct) + '</span></div><div class="meter"><i style="width:' + Number(w.remainPct || 0) + '%"></i></div></div>';
    }).join("");
    var balance = a.kind === "balance" ? '<p class="mono" style="font-size:20px;margin:8px 0 0">' + money(a) + "</p>" : windows;
    var tokenHint = info.tokenHint;
    var showToken = a.provider !== "codex" && a.authMode === "token";
    var token = showToken ? '<label class="field">' + esc(tokenHint) + '<textarea id="tok-' + esc(a.id) + '" placeholder="只存在本机 Keychain，不会写进仓库"></textarea></label>' : "";
    var core = ["codex", "grok", "cursor", "deepseek"].indexOf(a.id) >= 0;
    var conn = a.provider === "codex" ? codexCard() : "";
    var liveLabel = a.provider === "codex" ? "使用本机 Codex 登录实查" : "使用真实登录态 / Key";
    var liveChecked = a.provider === "codex" || a.authMode === "token";
    return '<div class="card" data-acc="' + esc(a.id) + '"><h3 style="margin:0 0 6px">' + esc(a.name) + '</h3><p class="note">' + esc(info.help) + '</p><div class="grid"><label class="check"><input class="en" type="checkbox" ' + (a.enabled !== false ? "checked" : "") + '>启用</label><label class="check"><input class="tok" type="checkbox" ' + (liveChecked ? "checked" : "") + (a.provider === "codex" ? " disabled" : "") + '>' + liveLabel + '</label></div>' + token + conn + '<div class="actions"><button class="primary refresh">刷新额度</button>' + (core ? "" : '<button class="danger del">删除</button>') + '</div><p class="note">' + esc(a.message || "") + (a.hasToken ? " · Keychain 已保存" : "") + "</p>" + balance + "</div>";
  }
  function codexCard() {
    var c = (m.app && m.app.connection) || {}, ready = c.status === "ready";
    var buckets = (c.buckets || []).map(function (b) {
      return '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + esc(b.label || "额度窗口") + '</span><span class="mono">剩余 ' + remainLabel(b.remainingPct) + '</span></div><div class="meter"><i style="width:' + (Number.isFinite(Number(b.remainingPct)) ? Number(b.remainingPct) : 0) + '%"></i></div></div>';
    }).join("");
    var identity = c.email || c.accountID || "未连接账户";
    var details = ready ? (' · ' + esc(identity) + (c.plan ? ' · ' + esc(c.plan) : '') + (c.lastUpdated ? ' · 更新于 ' + esc(new Date(c.lastUpdated).toLocaleString()) : '')) : '';
    return '<div class="status" style="margin-top:8px">' + esc(c.message || "请连接 ChatGPT/Codex") + '<br>连接状态：' + esc(c.status || "notLoggedIn") + details + '</div><div class="actions"><button class="primary" id="loginCodex">' + (ready ? '重新登录' : '连接账户') + '</button><button class="secondary" id="refreshCodex">刷新额度</button><button class="secondary" id="disconnectCodex">断开本 App 连接</button></div>' + (buckets ? '<div class="field"><label>订阅额度窗口</label>' + buckets + '</div>' : '') + '<p class="note">使用 AI Balance Whale 自己的官方浏览器授权与 Keychain 凭据。网页只接收脱敏身份和额度；断开只删除本 App 凭据，不会注销其它客户端登录。</p>';
  }
  function bindAccountCard(a) {
    var root = document.querySelector('[data-acc="' + a.id + '"]');
    if (!root) return;
    root.querySelector(".en").onchange = function () { a.enabled = this.checked; save(); };
    root.querySelector(".tok").onchange = function () { a.authMode = this.checked ? "token" : "demo"; save(); accountsPage(); };
    var ta = document.getElementById("tok-" + a.id);
    if (ta) ta.onchange = function () { if (this.value) post("saveCredential", { reference: a.keyRef || ("account." + a.id), value: this.value, accountId: a.id }); };
    root.querySelector(".refresh").onclick = function () { post("refreshAccounts", { accountId: a.id }); say("正在刷新 " + a.name); };
    var del = root.querySelector(".del");
    if (del) del.onclick = function () { post("removeAccount", { id: a.id }); };
    if (a.provider === "codex") {
      var login = document.getElementById("loginCodex"); if (login) login.onclick = function () { post("loginCodex"); say("已打开官方登录页面，请完成授权后返回本应用"); };
      var refresh = document.getElementById("refreshCodex"); if (refresh) refresh.onclick = function () { post("refreshCodex"); say("正在刷新 Codex 额度"); };
      var disconnect = document.getElementById("disconnectCodex"); if (disconnect) disconnect.onclick = function () { post("disconnectCodex"); say("已断开本 App 授权"); };
    }
  }

  function bubblesPage() {
    var host = document.getElementById("upstreamEditorMount");
    if (!host) return;
    host.setAttribute("aria-label", "上游气泡编辑器");
    if (window.__AIWhaleEditorAPI && window.__AIWhaleEditorAPI.openBubbleEditor) {
      window.__AIWhaleEditorMount = host;
      window.__AIWhaleEditorAPI.openBubbleEditor();
    } else {
      host.innerHTML = '<p class="status">本地编辑器脚本尚未就绪，请重新打开“气泡内容”。</p>';
    }
  }
  function moduleEditor(mod, si, mi, accs) {
    var subs = "", bals = "";
    accs.filter(function (a) { return a.kind === "subscription"; }).forEach(function (a) { subs += '<option value="' + esc(a.id) + '"' + (mod.accountId === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>"; });
    accs.filter(function (a) { return a.kind === "balance"; }).forEach(function (a) { bals += '<option value="' + esc(a.id) + '"' + (mod.accountId === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>"; });
    var extra = "";
    if (mod.type === "text") extra = '<label class="field">文本<input class="mtxt" value="' + esc(mod.text || "") + '"></label>';
    if (mod.type === "quota") {
      var acc = accs.filter(function (a) { return a.id === mod.accountId; })[0] || accs.filter(function (a) { return a.kind === "subscription"; })[0] || {};
      var wins = (acc.windows || []).map(function (w) { return '<option value="' + esc(w.id) + '"' + (mod.windowId === w.id ? " selected" : "") + ">" + esc(w.label || w.id) + "</option>"; }).join("");
      extra = '<label class="field">账户<select class="macc">' + subs + "</select></label><label class=\"field\">额度窗<select class=\"mwin\">" + (wins || "<option value=\"\">默认</option>") + "</select></label>";
    }
    if (mod.type === "balance") extra = '<label class="field">账户<select class="macc">' + bals + "</select></label>";
    if (mod.type === "random") extra = '<label class="field" style="grid-column:1/-1">语句（一行一条）<textarea class="mlines">' + esc((mod.lines || []).join("\n")) + "</textarea></label>";
    return '<div class="grid" data-mod="' + mi + '"><label class="field">模块<select class="mtype"><option value="dashboard">总览（全部账户）</option><option value="quota">订阅额度</option><option value="balance">余额</option><option value="text">文本</option><option value="random">随机语句</option><option value="image">图片</option></select></label>' + extra + "</div>";
  }
  function bindModuleEditor(root, ss, i, mi, accs) {
    var box = root.querySelector('[data-mod="' + mi + '"]');
    var typeSel = box.querySelector(".mtype");
    typeSel.value = ss[i].modules[mi].type;
    typeSel.onchange = function () {
      var t = this.value, next;
      if (t === "text") next = { type: "text", text: "新文本", size: 14, bold: true };
      else if (t === "dashboard") next = { type: "dashboard" };
      else if (t === "quota") next = { type: "quota", accountId: (accs.filter(function (a) { return a.kind === "subscription"; })[0] || {}).id || "codex", field: "full" };
      else if (t === "balance") next = { type: "balance", accountId: "deepseek" };
      else if (t === "image") next = { type: "image", src: "bubble-petpet.gif" };
      else next = { type: "random", lines: ["……"] };
      ss[i].modules[mi] = next; set(["bubble", "steps"], ss); save(); bubblesPage();
    };
    var txt = box.querySelector(".mtxt"); if (txt) txt.oninput = function () { ss[i].modules[mi].text = this.value; set(["bubble", "steps"], ss); save(); var preview = root.querySelector(".preview"); if (preview) preview.outerHTML = stepView(ss[i], accs); };
    var acc = box.querySelector(".macc"); if (acc) acc.onchange = function () { ss[i].modules[mi].accountId = this.value; set(["bubble", "steps"], ss); save(); bubblesPage(); };
    var win = box.querySelector(".mwin"); if (win) win.onchange = function () { ss[i].modules[mi].windowId = this.value; set(["bubble", "steps"], ss); save(); bubblesPage(); };
    var lines = box.querySelector(".mlines"); if (lines) lines.oninput = function () { ss[i].modules[mi].lines = this.value.split("\n").filter(Boolean); set(["bubble", "steps"], ss); save(); var preview = root.querySelector(".preview"); if (preview) preview.outerHTML = stepView(ss[i], accs); };
  }

  function appearancePage() {
    document.getElementById("appearance").innerHTML = '<div class="card"><p class="note">人偶使用内置鲸鱼形象。左吸附会水平翻转。</p><img src="DSniang1.png" alt="当前角色" style="height:160px;width:auto"></div>';
  }
  function soundsPage() {
    var s = get(["sound"], {}), v = s.volume == null ? 0.45 : s.volume;
    document.getElementById("sounds").innerHTML = '<div class="card"><label class="check"><input id="se" type="checkbox" ' + (s.enabled !== false ? "checked" : "") + '>按压音效</label><label>音量 <span id="vl">' + Math.round(v * 100) + '%</span></label><input id="vol" type="range" min="0" max="1" step=".05" value="' + v + '"><div class="actions"><button class="primary" id="saveS">保存</button></div><p class="note">默认按下/松开为 Ya1.mp3 / Ya2.mp3。</p></div>';
    document.getElementById("vol").oninput = function () { document.getElementById("vl").textContent = Math.round(Number(this.value) * 100) + "%"; };
    document.getElementById("saveS").onclick = function () { Object.assign(s, { enabled: yes("se"), volume: Number(val("vol")) }); save(); };
  }
  function alertsPage() {
    var r = get(["reminders"], {}), b = get(["bubble"], {}), accs = accounts();
    var low = accs.filter(function (a) { return a.enabled !== false && a.kind === "subscription" && (a.windows || []).some(function (w) { return Number(w.remainPct) <= Number(r.threshold == null ? 15 : r.threshold); }); });
    document.getElementById("alerts").innerHTML = '<div class="card"><label class="check"><input id="re" type="checkbox" ' + (r.enabled !== false ? "checked" : "") + '>低额度提醒</label><label>剩余低于 <span id="thv">' + esc(r.threshold == null ? 15 : r.threshold) + '%</span></label><input id="th" type="range" min="5" max="40" value="' + esc(r.threshold == null ? 15 : r.threshold) + '"><div class="field"><label>气泡自动关闭（秒，0 为保持）</label><input id="bc" type="number" min="0" value="' + esc(b.closeAfterSeconds || 0) + '"></div><button class="primary" id="saveR">保存</button></div>' + (r.enabled !== false && low.length ? '<div class="card"><h3>当前偏低</h3>' + low.map(function (a) { return "<p>" + esc(a.name) + " 剩余 " + remainLabel(((a.windows || [])[0] || {}).remainPct) + "</p>"; }).join("") + "</div>" : "");
    document.getElementById("th").oninput = function () { document.getElementById("thv").textContent = this.value + "%"; };
    document.getElementById("saveR").onclick = function () { set(["reminders", "enabled"], yes("re")); set(["reminders", "threshold"], Number(val("th")) || 15); set(["bubble", "closeAfterSeconds"], Math.max(0, Number(val("bc")) || 0)); save(); };
  }
  function aboutPage() {
    var c = (m.app && m.app.connection) || {};
    document.getElementById("about").innerHTML = '<div class="card"><div class="status">版本 ' + esc((m.app && m.app.version) || "未知") + " · 构建 " + esc((m.app && m.app.build) || "未知") + "<br>连接：" + esc(c.message || "未知") + '</div><div class="actions"><button class="secondary" id="backup">备份配置</button><button class="secondary" id="restore">恢复配置</button><button class="secondary" id="help">打开帮助</button><button class="secondary" id="feedback">问题反馈</button></div></div><div class="card"><h3>脱敏诊断</h3><div class="mono">' + esc(JSON.stringify((m.app && m.app.diagnostics) || [], null, 2)) + '</div></div><div class="card note">密钥只进 Keychain，不进 git。配置保存在 Application Support。基于 MeteorNOX 的 MIT 许可素材，由 404404 fork 维护。</div>';
    document.getElementById("backup").onclick = function () { post("backupConfig"); };
    document.getElementById("restore").onclick = function () { post("restoreConfig"); };
    document.getElementById("help").onclick = function () { post("openExternal", { url: "https://github.com/404404/AI-Balance-Whale-Widget#ai-balance-whale-macos" }); };
    document.getElementById("feedback").onclick = function () { post("openExternal", { url: "https://github.com/404404/AI-Balance-Whale-Widget/issues" }); };
  }

  var readyUI = false;
  window.__AIWhaleSettings = {
    update: function (x) {
      m = Object.assign(m, x || {});
      if (x && x.config) m.config = x.config;
      if (x && x.accounts) m.config.accounts = x.accounts;
      if (x && x.providerMeta) m.providerMeta = x.providerMeta;
      if (!readyUI) { navigation(); go(page); readyUI = true; return; }
      if (page === "accounts" || page === "alerts" || page === "about") render();
    },
    saveResult: function (requestId, ok) { say(ok ? "已保存，运行中的鲸鱼已更新" : "保存失败：配置文件无法写入"); },
    selectPage: go,
    preview: function () {}
  };
  document.getElementById("done").onclick = function () { try { window.close(); } catch (e) {} };
  navigation(); go("general"); post("ready");
}());
</script>
</body></html>
