<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#203170}body{padding:7px}.menu{background:rgba(255,255,255,.96);border:1px solid rgba(32,49,112,.35);border-radius:10px;padding:7px 0;box-shadow:0 6px 18px rgba(0,0,0,.18)}button{display:block;width:100%;border:0;background:transparent;color:#203170;text-align:left;padding:8px 14px;font:13px inherit;cursor:pointer}button:hover,button:focus{outline:0;background:rgba(32,49,112,.1)}.line{height:1px;background:rgba(32,49,112,.16);margin:5px 9px}.hint{display:block;padding:2px 14px 6px;color:#8190b5;font-size:11px}
</style></head><body><div class="menu" role="menu" aria-label="AI Balance Whale 菜单"><span class="hint">小鲸鱼额度</span><button data-action="refresh" role="menuitem">刷新额度</button><button data-action="settings" role="menuitem">设置</button><button data-action="settingsBubble" role="menuitem">编辑气泡</button><button data-action="settingsAccounts" role="menuitem">账户</button><div class="line"></div><button data-action="toggleBubble" role="menuitem">显示 / 收起气泡</button><button data-action="restoreDisplay" role="menuitem">恢复人偶显示</button></div><script>(function(){function post(x){try{webkit.messageHandlers.contextMenu.postMessage(x)}catch(e){}}document.querySelectorAll('button[data-action]').forEach(function(b){b.addEventListener('click',function(){post({type:'action',action:b.dataset.action})})});requestAnimationFrame(function(){post({type:'size',width:document.documentElement.scrollWidth+14,height:document.documentElement.scrollHeight+14})})}())</script></body></html>
